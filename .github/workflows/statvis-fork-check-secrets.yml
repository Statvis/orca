name: Statvis fork secrets check

# Quick check that the signing certificate and notarization credentials work, without building.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: macos-15
    timeout-minutes: 10
    env:
      CSC_LINK: ${{ secrets.MAC_CERTS }}
      CSC_KEY_PASSWORD: ${{ secrets.MAC_CERTS_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - name: Check signing certificate (MAC_CERTS, MAC_CERTS_PASSWORD)
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/check.keychain-db"
          security create-keychain -p check "$keychain"
          printf '%s' "$CSC_LINK" | base64 --decode >"$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$CSC_KEY_PASSWORD" -T /usr/bin/codesign
          security find-identity -v -p codesigning "$keychain" | tee "$RUNNER_TEMP/identities.txt"
          if ! grep -q "Developer ID Application: .*($APPLE_TEAM_ID)" "$RUNNER_TEMP/identities.txt"; then
            echo "::error::No Developer ID Application identity for team $APPLE_TEAM_ID in MAC_CERTS"
            exit 1
          fi
          echo "Signing certificate OK"

      - name: Check notarization credentials (APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID)
        run: |
          set -euo pipefail
          xcrun notarytool history --apple-id "$APPLE_ID" --password "$APPLE_APP_SPECIFIC_PASSWORD" --team-id "$APPLE_TEAM_ID" --output-format json >"$RUNNER_TEMP/history.json"
          echo "Notarization credentials OK ($(grep -o '"id"' "$RUNNER_TEMP/history.json" | wc -l | tr -d ' ') past submissions)"
